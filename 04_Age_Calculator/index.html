<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Age Calculator</title>
</head>
<body>
    <div id="main" style="background-color: bisque; width: 400px; justify-items: center; padding: 20px; border-radius: 20px;">
        <h1>Age Calculator</h1>
        <h3>Enter your date of birth</h3>
        <input type="date" id="date" style="margin-left: 50px; padding: 6px; outline: none; border: 0cap; border-radius: 7px; padding-inline: 90px;">
        <br>
        <button id="calculate" style="margin-left: 145px; outline: none; border: 0cap; margin-top: 20px; border-radius: 20px; padding: 8px; background-color: #751c1c; color: white; cursor: pointer;">Calculate Age</button>
        <h3 id="result"></h3>
    </div>

    <script src="Solution.js"></script>
</body>
</html>
